<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Diesel Dispense — Diesel Team</title>
<style>
  :root{
    --navy:#1b1f4f; --navy-dark:#10132e; --gold:#e0a94c;
    --orange:#f2891a; --orange-dark:#d9720a;
    --green:#16a34a; --green-dark:#15803d; --ink:#1a1a1a; --muted:#6b7280;
    --bg:#f4f5f7; --card:#ffffff; --border:#e5e7eb; --red:#dc2626; --blue:#1d4ed8;
    --glass-bg:rgba(255,255,255,.62); --glass-border:rgba(255,255,255,.55);
  }
  html{-webkit-text-size-adjust:100%;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(22,163,74,.3), transparent 42%),
      radial-gradient(circle at 88% 14%, rgba(224,169,76,.3), transparent 40%),
      radial-gradient(circle at 22% 92%, rgba(29,78,216,.22), transparent 45%),
      radial-gradient(circle at 88% 88%, rgba(139,58,183,.18), transparent 45%),
      linear-gradient(135deg,#0d1030 0%,#1b1f4f 45%,#241a4d 100%);
    background-attachment:fixed;background-size:cover;}
  .topbar{background:var(--navy);color:#fff;padding:clamp(18px,3.2vw,28px) 20px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold) 12%,var(--orange) 50%,var(--gold) 88%,transparent);}
  .topbar-inner{display:flex;align-items:center;justify-content:center;gap:18px;max-width:1100px;margin:0 auto;}
  .logo{height:clamp(48px,7vw,66px);width:auto;flex-shrink:0;display:block;}
  .title-divider{width:2px;align-self:stretch;min-height:40px;flex-shrink:0;
    background:linear-gradient(180deg,transparent,var(--gold),transparent);}
  .topbar-text{min-width:0;}
  .topbar h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(15px,5vw,34px);
    font-weight:700;letter-spacing:.2px;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.35);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar p{margin:6px 0 0;font-size:clamp(10px,2.6vw,13px);letter-spacing:1px;text-transform:uppercase;
    color:var(--gold);opacity:.95;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:480px){
    .topbar-inner{gap:10px;}
    .logo{height:36px;}
    .title-divider{min-height:30px;}
  }
  .wrap{max-width:560px;margin:0 auto;padding:clamp(12px,3vw,24px);}
  .card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:clamp(16px,3vw,28px);margin-top:16px;
    box-shadow:0 8px 32px rgba(16,19,46,.25);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;}
  input[readonly]{background:rgba(244,245,247,.85);color:var(--ink);font-weight:700;}
  input:focus{outline:none;border-color:var(--orange);}
  button{width:100%;margin-top:20px;padding:14px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:16px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;display:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .msg.err{background:rgba(254,242,242,.8);color:var(--red);border:1px solid #fecaca;display:block;}
  .details{margin-top:4px;}
  .details .row, .receipt .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .details .row span:first-child, .receipt .row span:first-child{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;}
  .details .row span:last-child, .receipt .row span:last-child{font-weight:700;text-align:right;font-size:14px;color:var(--ink);}
  .receipt{border:2px dashed var(--green);border-radius:10px;padding:18px;margin-top:16px;background:#fff;}
  .receipt .rbrand{text-align:center;padding-bottom:12px;margin-bottom:12px;border-bottom:2px solid var(--navy);}
  .receipt .rbrand-logo{display:block;height:42px;width:auto;margin:0 auto 6px;}
  .receipt .rbrand-title{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:17px;color:var(--navy);}
  .receipt .rbrand-sub{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--orange-dark);font-weight:700;margin-top:4px;}
  .receipt .rlogo{display:block;height:40px;width:auto;margin:0 auto 6px;border-radius:8px;}
  .receipt h2{margin:0 0 4px;font-size:16px;text-align:center;color:var(--green-dark);}
  .receipt .rno{text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px;}
  .print-btn{background:var(--blue);}
  .new-btn{background:#fff;color:var(--ink);border:1px solid var(--border);}

  .autocomplete-wrap{position:relative;}
  .suggestions{position:absolute;top:100%;left:0;right:0;background:rgba(255,255,255,.95);border:1px solid var(--border);
    border-top:none;border-radius:0 0 8px 8px;max-height:220px;overflow-y:auto;z-index:20;
    box-shadow:0 6px 14px rgba(0,0,0,.1);display:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .suggestions.show{display:block;}
  .suggestions .item{padding:10px 12px;font-size:14px;cursor:pointer;}
  .suggestions .item:hover,.suggestions .item.active{background:rgba(22,163,74,.12);}
  .suggestions .none{padding:10px 12px;font-size:13px;color:var(--muted);}

  .list-panel{max-width:560px;margin:20px auto 0;}
  .list-toggle{width:100%;text-align:left;padding:14px 18px;border-radius:16px;border:1px solid var(--glass-border);
    background:var(--glass-bg);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 32px rgba(16,19,46,.2);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
    display:flex;justify-content:space-between;align-items:center;}
  .list-body{display:none;margin-top:10px;}
  .list-body.show{display:block;}
  .list-toolbar{display:flex;gap:6px;flex-wrap:wrap;}
  .list-toolbar button{width:auto;margin-top:0;padding:7px 14px;border-radius:8px;border:1px solid var(--border);
    background:rgba(255,255,255,.85);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .list-toolbar button.active{background:var(--green);color:#fff;border-color:var(--green);}

  .date-filter{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .df-field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:125px;}
  .df-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .df-input-wrap{position:relative;}
  .df-input-wrap .df-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;pointer-events:none;opacity:.65;}
  .df-field input{width:100%;padding:9px 9px 9px 30px;border:2px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);font-weight:700;
    transition:border-color .18s,box-shadow .18s;}
  .df-field input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.16);}
  .df-btn{padding:9px 15px;border-radius:10px;border:2px solid var(--green);background:var(--green);color:#fff;
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px rgba(22,163,74,.35);
    transition:transform .12s;}
  .df-btn:active{transform:scale(.95);}
  .df-clear{background:none;border:2px solid var(--border);color:var(--muted);box-shadow:none;}
  @media (max-width:480px){
    .date-filter{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
    .df-field{min-width:0;}
    .df-btn{text-align:center;}
  }

  .summary-bar{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;}
  .summary-bar .stile{flex:1;min-width:90px;background:rgba(255,255,255,.85);border:1px solid var(--glass-border);border-top:3px solid var(--accent);
    border-radius:10px;padding:8px 10px;}
  .summary-bar .stile .snum{font-size:16px;font-weight:800;color:var(--ink);}
  .summary-bar .stile .slabel{font-size:9px;color:var(--muted);margin-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}

  /* Touch targets 44px on mobile (Apple/Google minimum recommendation) */
  @media (max-width:640px){
    .list-toolbar button{padding:11px 16px;font-size:14px;min-height:44px;}
    .df-field input,.df-btn{min-height:44px;font-size:14px;}
    .list-toggle{padding:14px 16px;min-height:48px;}
    .req-card-head{padding:14px 16px;}
  }
  .req-card{background:rgba(255,255,255,.85);border:1px solid var(--glass-border);border-left:4px solid var(--accent,var(--green));border-radius:14px;
    margin-top:10px;overflow:hidden;box-shadow:0 4px 16px rgba(16,19,46,.15);
    backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);transition:box-shadow .2s;}
  .req-card.open{box-shadow:0 6px 20px rgba(16,19,46,.2);}
  .req-card-head{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;transition:background .15s;}
  .req-card-head:active{background:rgba(22,163,74,.12);}
  .req-card .rc-id{font-weight:800;color:var(--navy);font-size:14px;}
  .req-card .rc-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .rc-source-tag{display:inline-block;margin-top:5px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:rgba(139,58,183,.14);color:#7c3aed;text-transform:uppercase;letter-spacing:.3px;}
  .rc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .req-card .rc-liters{font-weight:700;color:var(--green-dark);white-space:nowrap;}
  .rc-print-btn{background:none;border:none;font-size:16px;line-height:1;cursor:pointer;padding:6px;margin:-6px;
    color:var(--muted);flex-shrink:0;border-radius:6px;}
  .rc-print-btn:active{background:rgba(29,78,216,.12);color:var(--blue);}
  .req-card .rc-chevron{font-size:11px;color:var(--muted);transition:transform .2s;}
  .req-card.open .rc-chevron{transform:rotate(180deg);}
  .req-card-body{max-height:0;opacity:0;overflow:hidden;padding:0 16px;
    transition:max-height .3s cubic-bezier(.4,0,.2,1),opacity .22s ease,padding .3s ease;}
  .req-card.open .req-card-body{max-height:700px;opacity:1;padding:2px 16px 12px;}
  .req-card-body .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .req-card-body .r:last-child{border-bottom:none;}
  .req-card-body .r span:first-child{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;}
  .req-card-body .r span:last-child{font-weight:700;text-align:right;font-size:12.5px;color:var(--ink);}
  .req-card-body .use-id-btn{width:100%;margin-top:10px;padding:9px;background:var(--green);color:#fff;border:none;
    border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
  .status-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;margin-left:8px;}
  .status-Pending{background:#fef3c7;color:#d97706;}
  .status-Approved{background:#dcfce7;color:var(--green);}
  .status-Rejected{background:#fee2e2;color:var(--red);}
  .status-Dispensed{background:#dbeafe;color:var(--blue);}
  /* ---------- Login gate ---------- */
  #loginOverlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(circle at 12% 8%, rgba(22,163,74,.32), transparent 42%),
      radial-gradient(circle at 88% 14%, rgba(224,169,76,.3), transparent 40%),
      radial-gradient(circle at 22% 92%, rgba(29,78,216,.22), transparent 45%),
      linear-gradient(135deg,#0d1030 0%,#1b1f4f 45%,#241a4d 100%);}
  #loginOverlay.hide{display:none;}
  .login-card{width:100%;max-width:360px;background:var(--glass-bg);border:1px solid var(--glass-border);
    border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 8px 32px rgba(16,19,46,.35);
    backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  .login-card img{height:64px;width:auto;display:block;margin:0 auto 14px;border-radius:12px;}
  .login-card h2{margin:0 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:var(--navy);}
  .login-card .lsub{margin:0 0 18px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .login-card input{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:9px;
    font-size:16px;font-family:inherit;background:#fff;}
  .login-card input:focus{outline:none;border-color:var(--green);}
  .login-card button{width:100%;margin-top:6px;padding:12px;background:var(--green);color:#fff;border:none;border-radius:9px;
    font-size:15px;font-weight:700;cursor:pointer;}
  .pw-wrap{position:relative;margin-bottom:10px;}
  .pw-wrap input{margin-bottom:0 !important;padding-right:42px !important;}
  button.pw-toggle{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:auto !important;
    margin:0 !important;padding:6px 10px !important;background:none !important;color:var(--muted);
    font-size:17px;line-height:1;box-shadow:none !important;border:none !important;}
  button.pw-toggle:active{background:none !important;}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);font-weight:600;min-height:18px;}
  .shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-9px);}
    40%,80%{transform:translateX(9px);}
  }

  /* ---------- Live Status floating button + panel ---------- */
  .live-fab{position:fixed;right:18px;bottom:22px;z-index:900;width:58px;height:58px;border-radius:50%;
    background:radial-gradient(circle at 28% 24%, rgba(255,255,255,.55) 1px, transparent 1.6px) 0 0/9px 9px,
      linear-gradient(145deg,#ffb15c,#e0740a 55%,#c25f04);
    border:none;cursor:pointer;padding:0;
    box-shadow:0 7px 0 #a34e03,0 14px 30px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.5),0 0 0 0 rgba(242,137,26,.5);
    display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .2s;
    animation:liveFabBreathe 2.6s ease-in-out infinite;}
  .live-fab:hover{transform:translateY(-2px);}
  .live-fab:active{transform:translateY(4px);box-shadow:0 3px 0 #a34e03,0 6px 14px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.45);animation:none;}
  .live-fab.is-open{background:radial-gradient(circle at 28% 24%, rgba(255,255,255,.14) 1px, transparent 1.6px) 0 0/9px 9px,
      linear-gradient(145deg,#1b1f4f,#10132e);box-shadow:0 7px 0 #060814,0 14px 30px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,255,255,.15);animation:none;}
  @keyframes liveFabBreathe{
    0%,100%{box-shadow:0 7px 0 #a34e03,0 14px 30px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.5),0 0 0 0 rgba(242,137,26,.5);}
    50%{box-shadow:0 7px 0 #a34e03,0 14px 30px rgba(0,0,0,.45),inset 0 2px 4px rgba(255,255,255,.5),0 0 0 10px rgba(242,137,26,0);}
  }
  .live-fab::after{content:'👀 View Request Status';position:absolute;top:50%;right:calc(100% + 12px);
    transform:translateY(-50%) translateX(6px);
    background:linear-gradient(90deg,#ff6a3d,#ffb238,#ffe066,#5ee7a0,#3ab0ff,#c471ed,#ff6a3d);
    background-size:320% 100%;
    color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.2px;padding:7px 13px;border-radius:20px;
    white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.4);
    box-shadow:0 8px 22px rgba(0,0,0,.4),0 0 0 1.5px rgba(255,255,255,.35) inset,0 0 14px rgba(255,140,20,.4);
    opacity:0;pointer-events:none;
    animation:liveTagIn .5s ease .8s forwards,liveTagFloat 2.4s ease-in-out 1.4s infinite,liveTagGradient 4s linear infinite;}
  .live-fab.is-open::after{display:none;}
  @keyframes liveTagIn{to{opacity:1;transform:translateY(-50%) translateX(0);}}
  @keyframes liveTagFloat{0%,100%{transform:translateY(-50%) translateX(0);}50%{transform:translateY(-50%) translateX(-4px);}}
  @keyframes liveTagGradient{0%{background-position:0% 50%;}100%{background-position:320% 50%;}}
  .live-fab-icon{font-size:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));transition:transform .3s;display:block;position:relative;z-index:1;}
  .live-fab.is-open .live-fab-icon{transform:rotate(-14deg) scale(.92);}
  .live-fab-dot{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;
    background:#22c55e;border:2px solid #fff;animation:liveDotPulse 1.8s infinite;z-index:1;}
  @keyframes liveDotPulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.65);} 70%{box-shadow:0 0 0 9px rgba(34,197,94,0);} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
  }
  @media (max-width:360px){
    .live-fab::after{font-size:9.5px;padding:6px 10px;}
  }
  .live-panel{position:fixed;right:18px;bottom:90px;z-index:901;width:264px;max-width:calc(100vw - 28px);
    border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.93));
    box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.5) inset,0 0 40px rgba(242,137,26,.15);
    transform:scale(.8) translateY(20px);opacity:0;pointer-events:none;filter:blur(6px);
    transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .22s,filter .22s;
    backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  .live-panel.show{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;filter:blur(0);}
  .live-panel-head{position:relative;display:flex;justify-content:space-between;align-items:center;overflow:hidden;
    background:linear-gradient(120deg,var(--navy),var(--navy-dark) 55%,var(--navy));background-size:220% 100%;
    animation:liveHeadShift 6s ease-in-out infinite;color:#fff;padding:11px 14px;font-size:12.5px;font-weight:700;letter-spacing:.3px;}
  @keyframes liveHeadShift{0%,100%{background-position:0% 0;}50%{background-position:100% 0;}}
  .live-min-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:24px;height:24px;border-radius:7px;
    cursor:pointer;font-size:13px;line-height:1;flex-shrink:0;transition:background .15s,transform .15s;}
  .live-min-btn:hover{background:rgba(255,255,255,.28);transform:rotate(90deg);}
  .live-min-btn:active{background:rgba(255,255,255,.35);}
  .live-panel-body{padding:13px 14px 14px;}
  .live-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
  .live-stat-tile{position:relative;background:#fff;border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:11px;padding:8px 2px;text-align:center;
    box-shadow:0 3px 10px rgba(16,19,46,.1);transition:transform .18s,box-shadow .18s;}
  .live-stat-tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,19,46,.16);}
  .live-stat-tile .lnum{font-size:18px;font-weight:800;color:var(--ink);display:inline-block;transition:transform .2s;}
  .live-stat-tile .lnum.bump{animation:liveNumBump .4s ease;}
  @keyframes liveNumBump{0%{transform:scale(1);}40%{transform:scale(1.35);color:var(--accent);}100%{transform:scale(1);}}
  .live-stat-tile .llabel{font-size:8px;color:var(--muted);margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .live-list{margin-top:11px;max-height:172px;overflow-y:auto;}
  .live-list::-webkit-scrollbar{width:5px;}
  .live-list::-webkit-scrollbar-track{background:transparent;}
  .live-list::-webkit-scrollbar-thumb{background:var(--gold);border-radius:4px;}
  .live-list-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 2px;
    border-bottom:1px dashed var(--border);font-size:11px;opacity:0;transform:translateX(10px);
    animation:liveRowIn .32s ease forwards;}
  .live-list-row:last-child{border-bottom:none;}
  @keyframes liveRowIn{to{opacity:1;transform:translateX(0);}}
  .live-list-row .lid{font-weight:700;color:var(--navy);white-space:nowrap;}
  .live-list-row .lveh{color:var(--muted);font-size:9.5px;margin-left:4px;}
  .live-empty{text-align:center;color:var(--muted);font-size:11px;padding:10px 0;animation:liveRowIn .3s ease;}
  .live-updated{margin-top:11px;font-size:9.5px;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:5px;}
  .live-updated::before{content:'';width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0;}
  @media (max-width:480px){
    .live-fab{width:52px;height:52px;right:14px;bottom:16px;}
    .live-panel{right:14px;bottom:80px;}
  }

  @media print {
    @page { margin: 10mm; size: auto; }
    html, body { height:auto !important; }
    .topbar, .no-print, #loginOverlay, #verifyCard, #dispenseCard, .list-panel, .live-fab, .live-panel { display:none !important; }
    .wrap{max-width:100%;padding:0;margin:0;}
    .card{border:none;box-shadow:none;background:#fff !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
      margin-top:0;padding:0;}
    .receipt{border:1px solid #999;border-radius:0;padding:12px;margin-top:0;page-break-inside:avoid;background:#fff !important;}
    .receipt .rbrand{padding-bottom:8px;margin-bottom:8px;}
    .receipt .rbrand-logo{height:34px;}
    .receipt .rbrand-title{font-size:14px;}
    .receipt .rbrand-sub{font-size:8px;}
    .receipt .rlogo{height:32px;margin-bottom:4px;}
    .receipt h2{font-size:14px;margin-bottom:2px;}
    .receipt .rno{font-size:11px;margin-bottom:8px;}
    .receipt .row{padding:2.5px 0;}
    .receipt .row span:first-child{font-size:9px;}
    .receipt .row span:last-child{font-size:11px;}
  }
</style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-card" id="loginCard">
      <img src="logo.png" alt="Logo">
      <h2>🛢️ Diesel Dispense</h2>
      <p class="lsub">Stage 3 — Diesel Team Login</p>
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="User ID" autocomplete="username" autocapitalize="off">
        <div class="pw-wrap">
          <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" tabindex="-1" aria-label="Show password">👁️</button>
        </div>
        <button type="submit">Login</button>
      </form>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <img src="logo.png" alt="Logo" class="logo">
      <div class="title-divider"></div>
      <div class="topbar-text">
        <h1>🛢️ Diesel Dispense</h1>
        <p>Stage 3 — Diesel Team</p>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="card no-print" id="verifyCard">
      <label>Request ID</label>
      <input type="text" id="reqId" placeholder="e.g. DSL001" autocapitalize="characters">

      <button id="verifyBtn">Open Request</button>
      <div class="msg" id="verifyMsg"></div>
    </div>

    <div class="card no-print" id="dispenseCard" style="display:none;">
      <div class="details" id="detailsBox"></div>

      <label>Diesel Pump / Location <span style="color:var(--red)">*</span></label>
      <div class="autocomplete-wrap">
        <input type="text" id="pumpLocation" autocomplete="off" placeholder="Type to search...">
        <div class="suggestions" id="pumpSuggestions"></div>
      </div>

      <label>Rate per Liter (₹) <span style="color:var(--red)">*</span></label>
      <input type="number" id="ratePerLiter" min="0.01" step="0.01" placeholder="e.g. 92.50">

      <label>Amount (₹)</label>
      <input type="text" id="amount" readonly placeholder="Calculates automatically once rate is entered">

      <label>Dispensed By (your name) <span style="color:var(--red)">*</span></label>
      <input type="text" id="dispensedBy" placeholder="Your name">

      <button id="confirmBtn">✔ Confirm & Generate Receipt</button>
      <div class="msg" id="dispenseMsg"></div>
    </div>

    <div class="card" id="receiptCard" style="display:none;">
      <div class="receipt" id="receiptBox"></div>
      <button class="print-btn no-print" id="printBtn">🖨️ Print Receipt</button>
      <button class="new-btn no-print" id="newBtn">+ New Dispense</button>
    </div>

    <div class="list-panel no-print">
      <button class="list-toggle" id="listToggle">
        <span>📋 Requests — check status</span>
        <span id="listChevron">▾</span>
      </button>
      <div class="list-body" id="listBody">
        <input type="text" id="listSearch" placeholder="Search by Vehicle No or Request ID..." style="margin-bottom:10px;">
        <div class="list-toolbar">
          <button class="list-filter" data-status="Pending">Pending</button>
          <button class="list-filter active" data-status="Approved">Approved</button>
          <button class="list-filter" data-status="">All</button>
        </div>

        <div class="date-filter">
          <div class="df-field"><label>From</label><div class="df-input-wrap"><span class="df-icon">📅</span><input type="date" id="dateFrom"></div></div>
          <div class="df-field"><label>To</label><div class="df-input-wrap"><span class="df-icon">📅</span><input type="date" id="dateTo"></div></div>
          <button type="button" class="df-btn df-today" id="dateToday">⏱️ Today</button>
          <button type="button" class="df-btn df-clear" id="dateClear">✕ Clear</button>
        </div>
        <div class="summary-bar" id="summaryBar"></div>

        <div id="approvedList"></div>
      </div>
    </div>

  </div>

  <button class="live-fab no-print" id="liveFab" type="button" title="Live Status">
    <span class="live-fab-icon">📊</span>
    <span class="live-fab-dot"></span>
  </button>
  <div class="live-panel no-print" id="livePanel">
    <div class="live-panel-head">
      <span>🔴 Live Status</span>
      <button type="button" class="live-min-btn" id="liveMinBtn" title="Minimize">➖</button>
    </div>
    <div class="live-panel-body">
      <div class="live-stats">
        <div class="live-stat-tile" style="--accent:#d97706;"><div class="lnum" id="liveNumPending">-</div><div class="llabel">Pending</div></div>
        <div class="live-stat-tile" style="--accent:#16a34a;"><div class="lnum" id="liveNumApproved">-</div><div class="llabel">Approved</div></div>
        <div class="live-stat-tile" style="--accent:#1d4ed8;"><div class="lnum" id="liveNumDispensed">-</div><div class="llabel">Dispensed</div></div>
      </div>
      <div class="live-list" id="liveList"><div class="live-empty">Open to load...</div></div>
      <div class="live-updated" id="liveUpdated"></div>
    </div>
  </div>

<script>
  /* ---------- Login gate ---------- */
  (function(){
    var USER = 'Diesel3', PASS = 'Diesel@11', KEY = 'dieselAuthDiesel';
    var overlay = document.getElementById('loginOverlay');
    var card = document.getElementById('loginCard');
    var errEl = document.getElementById('loginErr');

    if (sessionStorage.getItem(KEY) === '1') overlay.classList.add('hide');

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('loginUser').value.trim();
      var p = document.getElementById('loginPass').value;
      if (u === USER && p === PASS) {
        sessionStorage.setItem(KEY, '1');
        overlay.classList.add('hide');
        errEl.textContent = '';
      } else {
        errEl.textContent = 'Invalid User ID or Password';
        card.classList.remove('shake');
        void card.offsetWidth; // reflow so the shake animation can replay
        card.classList.add('shake');
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        document.getElementById('loginPass').value = '';
      }
    });
  })();

  /* ---------- Show/hide password toggle ---------- */
  (function(){
    var input = document.getElementById('loginPass');
    var btn = document.getElementById('pwToggle');
    btn.addEventListener('click', function(){
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁️';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  })();

  // Paste the /exec URL here after deploying the Google Apps Script "Web App"
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybGePj0rLOxG_xdK-XjXtipxm_izdiozm9rgWbKTsY7L7XbFhSrzgs86JNCWvxO-0ipw/exec";

  var verifiedRow = null;

  document.getElementById('verifyBtn').addEventListener('click', function(){
    loadRequest(document.getElementById('reqId').value.trim());
  });
  document.getElementById('confirmBtn').addEventListener('click', confirmDispense);
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  document.getElementById('newBtn').addEventListener('click', resetAll);

  /* ---------- Diesel Pump / Location: searchable autocomplete ---------- */
  var pumpInput = document.getElementById('pumpLocation');
  var pumpSuggestions = document.getElementById('pumpSuggestions');
  var allPumps = [];

  /* Pump list is cached in the browser for 6 hours — Apps Script takes ~2.5s
     per call, so repeat visits get suggestions instantly. */
  (function loadPumps(){
    var KEY = 'dieselPumps', TTL = 6 * 60 * 60 * 1000;
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var c = JSON.parse(raw);
        if (c && (Date.now() - c.t) < TTL && c.d) allPumps = c.d;
      }
    } catch (e) { /* corrupt cache — fetch fresh from network */ }

    if (!APPS_SCRIPT_URL) return;
    fetch(APPS_SCRIPT_URL + '?action=pumps')
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) return;
        allPumps = res.pumps;
        try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), d: allPumps })); } catch (e) {}
        if (document.activeElement === pumpInput && pumpInput.value.trim()) renderPumpSuggestions(pumpInput.value.trim());
      })
      .catch(function(){ /* offline — cache/typed value still works */ });
  })();

  pumpInput.addEventListener('input', function(){ renderPumpSuggestions(pumpInput.value.trim()); });
  pumpInput.addEventListener('focus', function(){ if (pumpInput.value.trim()) renderPumpSuggestions(pumpInput.value.trim()); });
  pumpInput.addEventListener('blur', function(){ setTimeout(function(){ pumpSuggestions.classList.remove('show'); }, 150); });

  function renderPumpSuggestions(query){
    if (!query || !allPumps.length) { pumpSuggestions.classList.remove('show'); return; }
    var q = query.toUpperCase();
    var matches = allPumps.filter(function(v){ return v.toUpperCase().indexOf(q) !== -1; }).slice(0, 8);
    if (!matches.length) {
      pumpSuggestions.innerHTML = '<div class="none">No match found — your typed value will be used</div>';
      pumpSuggestions.classList.add('show');
      return;
    }
    pumpSuggestions.innerHTML = matches.map(function(v){ return '<div class="item">' + esc(v) + '</div>'; }).join('');
    pumpSuggestions.classList.add('show');
    pumpSuggestions.querySelectorAll('.item').forEach(function(el, i){
      el.addEventListener('mousedown', function(e){
        e.preventDefault();
        pumpInput.value = matches[i];
        pumpSuggestions.classList.remove('show');
      });
    });
  }

  function loadRequest(id){
    var msg = document.getElementById('verifyMsg');
    msg.className = 'msg';

    if (!APPS_SCRIPT_URL) { showErr(msg, 'Setup pending: deploy Code.gs and paste the APPS_SCRIPT_URL here in the HTML.'); return; }
    if (!id) { showErr(msg, 'Enter a Request ID.'); return; }
    document.getElementById('reqId').value = id;

    var btn = document.getElementById('verifyBtn');
    btn.disabled = true; btn.textContent = 'Loading...';

    fetch(APPS_SCRIPT_URL + '?action=verify&id=' + encodeURIComponent(id))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) { showErr(msg, '❌ ' + res.error); return; }
        verifiedRow = res.row;
        showDispenseForm(res.row);
      })
      .catch(function(err){ showErr(msg, '❌ Network error: ' + err.message); })
      .finally(function(){ btn.disabled = false; btn.textContent = 'Open Request'; });
  }

  function showDispenseForm(row){
    document.getElementById('verifyCard').style.display = 'none';
    var box = document.getElementById('detailsBox');
    box.innerHTML =
      detailRow('Request ID', row.id) +
      detailRow('Vehicle No', row.vehicleNo) +
      detailRow('Driver ID', row.driverId) +
      detailRow('Driver Name', row.driverName) +
      detailRow('Route / Trip', row.routeTrip || '-') +
      detailRow('Current Location', row.currentLocation || '-') +
      detailRow('Odometer (KM)', row.odometerKm || '-') +
      detailRow('Approved Liters', row.approvedLiters);
    document.getElementById('ratePerLiter').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('dispenseCard').style.display = 'block';
  }

  document.getElementById('ratePerLiter').addEventListener('input', updateAmount);
  function updateAmount(){
    var rate = Number(document.getElementById('ratePerLiter').value) || 0;
    var liters = verifiedRow ? Number(verifiedRow.approvedLiters) || 0 : 0;
    var amountEl = document.getElementById('amount');
    amountEl.value = rate && liters ? '₹ ' + (rate * liters).toFixed(2) : '';
  }

  function confirmDispense(){
    var msg = document.getElementById('dispenseMsg');
    msg.className = 'msg';
    var pumpLocation = pumpInput.value.trim();
    var ratePerLiter = document.getElementById('ratePerLiter').value;
    var dispensedBy = document.getElementById('dispensedBy').value.trim();
    if (!pumpLocation) { showErr(msg, 'Enter the Diesel Pump / Location.'); return; }
    if (!ratePerLiter || !dispensedBy) { showErr(msg, 'Enter both Rate per Liter and your name.'); return; }

    var btn = document.getElementById('confirmBtn');
    btn.disabled = true; btn.textContent = 'Saving...';

    var id = document.getElementById('reqId').value.trim();

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'dispense', id: id, pumpLocation: pumpLocation, ratePerLiter: ratePerLiter, dispensedBy: dispensedBy })
    }).then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok) { showErr(msg, '❌ ' + res.error); return; }
      showReceipt(res.receipt);
    })
    .catch(function(err){ showErr(msg, '❌ Network error: ' + err.message); })
    .finally(function(){ btn.disabled = false; btn.textContent = '✔ Confirm & Generate Receipt'; });
  }

  function showReceipt(r){
    document.getElementById('dispenseCard').style.display = 'none';
    var box = document.getElementById('receiptBox');
    box.innerHTML =
      '<div class="rbrand">' +
        '<img src="logo.png" alt="Logo" class="rbrand-logo">' +
        '<div class="rbrand-title">⛽ Diesel Approval System</div>' +
        '<div class="rbrand-sub">3-Stage Workflow — Calling Team → Manager → Diesel Team</div>' +
      '</div>' +
      '<img src="logo.png" alt="Logo" class="rlogo">' +
      '<h2>✅ Diesel Dispensed</h2>' +
      '<div class="rno">Receipt No: ' + r.receiptNo + '</div>' +
      detailRow('Request ID', r.id) +
      detailRow('Vehicle No', r.vehicleNo) +
      detailRow('Driver ID', r.driverId) +
      detailRow('Driver Name', r.driverName) +
      detailRow('Route / Trip', r.routeTrip || '-') +
      detailRow('Current Location', r.currentLocation || '-') +
      detailRow('Pump / Location', r.pumpLocation || '-') +
      detailRow('Odometer (KM)', r.odometerKm || '-') +
      detailRow('Liters Dispensed', r.actualLiters) +
      detailRow('Rate per Liter', '₹ ' + r.ratePerLiter) +
      detailRow('Amount', '₹ ' + r.amount) +
      detailRow('Requested By', r.requestedBy || '-') +
      detailRow('Approved By', r.managerName || '-') +
      detailRow('Dispensed By', r.dispensedBy) +
      detailRow('Date / Time', fmtDate(r.dispensedAt));
    document.getElementById('receiptCard').style.display = 'block';
  }

  // Reprint the receipt for an already-dispensed request straight from the
  // browsable list — no need to re-verify via Request ID/OTP again.
  function printReceiptFromList(r){
    document.getElementById('verifyCard').style.display = 'none';
    listBody.classList.remove('show');
    listChevron.textContent = '▾';
    window.scrollTo({ top: 0, behavior: 'auto' });
    showReceipt(r);
    setTimeout(function(){ window.print(); }, 150);
  }

  function resetAll(){
    verifiedRow = null;
    document.getElementById('reqId').value = '';
    pumpInput.value = '';
    document.getElementById('ratePerLiter').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('dispensedBy').value = '';
    document.getElementById('verifyMsg').className = 'msg';
    document.getElementById('dispenseMsg').className = 'msg';
    document.getElementById('receiptCard').style.display = 'none';
    document.getElementById('dispenseCard').style.display = 'none';
    document.getElementById('verifyCard').style.display = 'block';
  }

  function detailRow(label, val){
    return '<div class="row"><span>' + label + '</span><span>' + esc(val) + '</span></div>';
  }
  function showErr(el, text){ el.className = 'msg err'; el.textContent = text; }
  function fmtDate(d){ if (!d) return ''; try { return new Date(d).toLocaleString('en-IN'); } catch(e){ return d; } }
  function esc(s){
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ---------- Requests: browsable list (Pending/Approved/All) ---------- */
  var listToggle = document.getElementById('listToggle');
  var listChevron = document.getElementById('listChevron');
  var listBody = document.getElementById('listBody');
  var approvedList = document.getElementById('approvedList');
  var listSearch = document.getElementById('listSearch');
  var listLoadedFor = null;
  var listStatus = 'Approved';
  var listRequestToken = 0;
  var listRowsCache = [];

  var STATUS_ACCENT = { Pending: '#d97706', Approved: 'var(--green)', Rejected: 'var(--red)', Dispensed: 'var(--blue)' };

  listToggle.addEventListener('click', function(){
    var open = listBody.classList.toggle('show');
    listChevron.textContent = open ? '▴' : '▾';
    if (open && listLoadedFor !== listStatus) loadRequestsList();
  });

  document.querySelectorAll('.list-filter').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.list-filter').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      listStatus = btn.getAttribute('data-status');
      loadRequestsList();
    });
  });

  listSearch.addEventListener('input', function(){ applySearchAndRender(); });

  /* ---------- Date filter: From/To (leave To blank for a single day) ---------- */
  var dateFromInput = document.getElementById('dateFrom');
  var dateToInput = document.getElementById('dateTo');
  var summaryBar = document.getElementById('summaryBar');
  [dateFromInput, dateToInput].forEach(function(el){
    el.addEventListener('change', applySearchAndRender);
  });
  document.getElementById('dateToday').addEventListener('click', function(){
    var t = toDateStr_(new Date());
    dateFromInput.value = t;
    dateToInput.value = t;
    applySearchAndRender();
  });
  document.getElementById('dateClear').addEventListener('click', function(){
    dateFromInput.value = '';
    dateToInput.value = '';
    applySearchAndRender();
  });

  function toDateStr_(d){
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function inDateFilter_(createdAt){
    var from = dateFromInput.value, to = dateToInput.value;
    if (!from && !to) return true;
    var day = toDateStr_(new Date(createdAt));
    var lo = from || to, hi = to || from;
    return day >= lo && day <= hi;
  }
  function renderSummary(rows){
    var liters = 0, amount = 0;
    rows.forEach(function(r){
      if (r.status === 'Dispensed') { liters += Number(r.actualLiters) || 0; amount += Number(r.amount) || 0; }
    });
    var tiles = [
      { label: 'Requests', num: rows.length, accent: 'var(--green)' },
      { label: 'Liters Dispensed', num: liters.toFixed(1), accent: '#d97706' },
      { label: 'Amount Dispensed', num: '₹' + amount.toFixed(0), accent: '#059669' }
    ];
    summaryBar.innerHTML = tiles.map(function(t){
      return '<div class="stile" style="--accent:' + t.accent + '"><div class="snum">' + t.num + '</div><div class="slabel">' + t.label + '</div></div>';
    }).join('');
  }

  function applySearchAndRender(){
    var q = listSearch.value.trim().toUpperCase();
    var rows = !q ? listRowsCache : listRowsCache.filter(function(r){
      return String(r.vehicleNo || '').toUpperCase().indexOf(q) !== -1 ||
             String(r.id || '').toUpperCase().indexOf(q) !== -1;
    });
    if (dateFromInput.value || dateToInput.value) rows = rows.filter(function(r){ return inDateFilter_(r.createdAt); });
    renderSummary(rows);
    renderApprovedList(rows);
  }

  function loadRequestsList(){
    if (!APPS_SCRIPT_URL) {
      approvedList.innerHTML = '<div style="padding:10px;color:var(--muted);">Setup pending.</div>';
      return;
    }
    var token = ++listRequestToken;
    var requestedStatus = listStatus;
    approvedList.innerHTML = '<div style="padding:10px;color:var(--muted);">Loading...</div>';
    summaryBar.innerHTML = '';
    fetch(APPS_SCRIPT_URL + '?action=list&source=all&status=' + encodeURIComponent(requestedStatus))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (token !== listRequestToken) return; // stale response, ignore
        if (!res.ok) { approvedList.innerHTML = '<div style="padding:10px;color:var(--red);">Error: ' + esc(res.error) + '</div>'; return; }
        listLoadedFor = requestedStatus;
        listRowsCache = res.rows;
        applySearchAndRender();
      })
      .catch(function(err){
        if (token !== listRequestToken) return;
        approvedList.innerHTML = '<div style="padding:10px;color:var(--red);">Network error: ' + esc(err.message) + '</div>';
      });
  }

  function renderApprovedList(rows){
    if (!rows.length) { approvedList.innerHTML = '<div style="padding:10px;color:var(--muted);">No requests found.</div>'; return; }
    approvedList.innerHTML = '';
    rows.forEach(function(r){ approvedList.appendChild(buildReqCard(r)); });
  }

  function buildReqCard(r){
    var liters = r.status === 'Dispensed' ? r.actualLiters : (r.status === 'Pending' ? r.requestedLiters : r.approvedLiters);
    var accent = STATUS_ACCENT[r.status] || 'var(--green)';

    var card = document.createElement('div');
    card.className = 'req-card';
    card.style.setProperty('--accent', accent);

    var printIconHtml = r.status === 'Dispensed' ? '<button type="button" class="rc-print-btn" title="Print receipt">🖨️</button>' : '';

    var officeTagHtml = /^OT/i.test(r.id || '') ? '<span class="rc-source-tag">🏭 Office/Tanker</span>' : '';

    var head = document.createElement('div');
    head.className = 'req-card-head';
    head.innerHTML =
      '<div>' +
        '<div class="rc-id">' + esc(r.id) + '<span class="status-chip status-' + r.status + '">' + esc(r.status) + '</span></div>' +
        '<div class="rc-meta">' + esc(r.vehicleNo) + ' • ' + esc(r.driverName || '-') + '</div>' +
        '<div class="rc-meta">By: ' + esc(r.requestedBy || '-') + ' • ' + fmtDate(r.createdAt) + '</div>' +
        officeTagHtml +
      '</div>' +
      '<div class="rc-right">' + printIconHtml + '<span class="rc-liters">' + esc(liters) + ' L</span><span class="rc-chevron">▾</span></div>';
    head.addEventListener('click', function(){
      var wasOpen = card.classList.contains('open');
      approvedList.querySelectorAll('.req-card.open').forEach(function(el){ el.classList.remove('open'); });
      if (!wasOpen) card.classList.add('open');
    });
    if (r.status === 'Dispensed') {
      head.querySelector('.rc-print-btn').addEventListener('click', function(e){
        e.stopPropagation();
        printReceiptFromList(r);
      });
    }
    card.appendChild(head);

    var body = document.createElement('div');
    body.className = 'req-card-body';
    body.innerHTML =
      row('Driver ID', r.driverId) +
      row('Route / Trip', r.routeTrip || '-') +
      row('Current Location', r.currentLocation || '-') +
      row('Odometer (KM)', r.odometerKm || '-') +
      row('Requested Liters', r.requestedLiters) +
      row('Approved Liters', r.approvedLiters || '-') +
      row('Manager', r.managerName || '-') +
      row('Pump / Location', r.pumpLocation || '-') +
      row('Actual Liters', r.actualLiters || '-') +
      row('Rate per Liter', r.ratePerLiter ? '₹ ' + r.ratePerLiter : '-') +
      row('Amount', r.amount ? '₹ ' + r.amount : '-') +
      row('Dispensed By', r.dispensedBy || '-') +
      row('Receipt No', r.receiptNo || '-');

    if (r.status === 'Approved') {
      var useBtn = document.createElement('button');
      useBtn.type = 'button';
      useBtn.className = 'use-id-btn';
      useBtn.textContent = '⬆️ Dispense This';
      useBtn.addEventListener('click', function(e){
        e.stopPropagation();
        listBody.classList.remove('show');
        listChevron.textContent = '▾';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        loadRequest(r.id);
      });
      body.appendChild(useBtn);
    }

    card.appendChild(body);
    return card;
  }

  function row(label, val){
    return '<div class="r"><span>' + label + '</span><span>' + esc(val) + '</span></div>';
  }

  /* ---------- Live Status floating panel ----------
     Click the FAB to open; polls every 20s while open, stops the moment
     it's minimized so it isn't hammering the API in the background.
     source=all so it reflects both the main Requests and Office/Tanker
     sheets — this is a global glance, not scoped to any one person. */
  (function(){
    var fab = document.getElementById('liveFab');
    var panel = document.getElementById('livePanel');
    var minBtn = document.getElementById('liveMinBtn');
    var listEl = document.getElementById('liveList');
    var updatedEl = document.getElementById('liveUpdated');
    var pollTimer = null;
    var POLL_MS = 20000;
    var prevCounts = { Pending: null, Approved: null, Dispensed: null };

    fab.addEventListener('click', function(){
      panel.classList.add('show');
      fab.classList.add('is-open');
      refreshLive_();
      if (!pollTimer) pollTimer = setInterval(refreshLive_, POLL_MS);
    });
    minBtn.addEventListener('click', function(){
      panel.classList.remove('show');
      fab.classList.remove('is-open');
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    });

    function bumpNum_(el, val){
      el.textContent = val;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }

    function refreshLive_(){
      if (!APPS_SCRIPT_URL) return;
      fetch(APPS_SCRIPT_URL + '?action=list&limit=500&source=all')
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (!res.ok) { updatedEl.textContent = 'Error: ' + res.error; return; }
          var counts = { Pending: 0, Approved: 0, Dispensed: 0 };
          res.rows.forEach(function(r){ counts[r.status] = (counts[r.status] || 0) + 1; });
          var pendEl = document.getElementById('liveNumPending');
          var apprEl = document.getElementById('liveNumApproved');
          var dispEl = document.getElementById('liveNumDispensed');
          if (prevCounts.Pending !== counts.Pending) bumpNum_(pendEl, counts.Pending); else pendEl.textContent = counts.Pending;
          if (prevCounts.Approved !== counts.Approved) bumpNum_(apprEl, counts.Approved); else apprEl.textContent = counts.Approved;
          if (prevCounts.Dispensed !== counts.Dispensed) bumpNum_(dispEl, counts.Dispensed); else dispEl.textContent = counts.Dispensed;
          prevCounts = counts;

          var recent = res.rows.slice(0, 15);
          listEl.innerHTML = recent.length ? recent.map(function(r, i){
            return '<div class="live-list-row" style="animation-delay:' + (i * 0.045) + 's"><span><span class="lid">' + esc(r.id) + '</span><span class="lveh">' + esc(r.vehicleNo || '') + '</span></span>' +
              '<span class="status-chip status-' + r.status + '">' + esc(r.status) + '</span></div>';
          }).join('') : '<div class="live-empty">No requests yet.</div>';

          updatedEl.textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN');
        })
        .catch(function(){ updatedEl.textContent = 'Update failed — retrying...'; });
    }
  })();
</script>
</body>
</html>
