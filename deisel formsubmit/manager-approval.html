<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo.png">
<title>Diesel Approval — Manager</title>
<style>
  :root{
    --navy:#1b1f4f; --navy-dark:#10132e; --gold:#e0a94c;
    --orange:#f2891a; --orange-dark:#d9720a; --orange-light:#fef3e8;
    --blue:#1d4ed8; --ink:#1a1a1a; --muted:#6b7280;
    --bg:#f4f5f7; --card:#ffffff; --border:#e5e7eb; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --glass-bg:rgba(255,255,255,.62); --glass-border:rgba(255,255,255,.55);
  }
  html{-webkit-text-size-adjust:100%;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(242,137,26,.32), transparent 42%),
      radial-gradient(circle at 88% 14%, rgba(224,169,76,.28), transparent 40%),
      radial-gradient(circle at 22% 92%, rgba(29,78,216,.22), transparent 45%),
      radial-gradient(circle at 88% 88%, rgba(139,58,183,.18), transparent 45%),
      linear-gradient(135deg,#0d1030 0%,#1b1f4f 45%,#241a4d 100%);
    background-attachment:fixed;background-size:cover;}
  .topbar{background:var(--navy);color:#fff;padding:clamp(14px,2.6vw,20px) 20px;position:sticky;top:0;z-index:5;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold) 12%,var(--orange) 50%,var(--gold) 88%,transparent);}
  .topbar-inner{display:flex;align-items:center;justify-content:center;gap:16px;max-width:1400px;margin:0 auto;}
  .logo{height:clamp(40px,5.5vw,54px);width:auto;flex-shrink:0;display:block;}
  .title-divider{width:2px;align-self:stretch;min-height:34px;flex-shrink:0;
    background:linear-gradient(180deg,transparent,var(--gold),transparent);}
  .topbar-text{min-width:0;}
  .topbar h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(16px,4.6vw,28px);
    font-weight:700;letter-spacing:.2px;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.35);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar p{margin:5px 0 0;font-size:clamp(10px,2.4vw,13px);letter-spacing:1px;text-transform:uppercase;
    color:var(--gold);opacity:.95;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:480px){
    .topbar-inner{gap:10px;}
    .logo{height:32px;}
    .title-divider{min-height:26px;}
  }
  .wrap{max-width:1400px;margin:0 auto;padding:clamp(12px,2.5vw,24px);}
  .top-controls{max-width:640px;margin:0 auto;background:var(--glass-bg);border:1px solid var(--glass-border);
    border-radius:16px;padding:16px 18px;box-shadow:0 8px 32px rgba(16,19,46,.2);
    backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  .toolbar{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .toolbar button{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.7);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}
  .toolbar button.active{background:var(--orange);color:#fff;border-color:var(--orange);}
  .refresh{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:8px;padding:9px 14px;
    color:var(--orange-dark);font-weight:600;font-size:13px;cursor:pointer;}
  @media (min-width:560px){ .refresh{margin-left:auto;} }
  /* Touch targets 44px on mobile (Apple/Google minimum recommendation) */
  @media (max-width:640px){
    .toolbar button,.refresh{padding:11px 16px;font-size:14px;min-height:44px;}
    .card-head{padding:14px 16px;}
    .vo-toggle{padding:14px 16px;min-height:48px;}
  }
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;font-size:14px;
    background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  #list{margin-top:4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-items:start;}
  .card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;
    box-shadow:0 8px 32px rgba(16,19,46,.2);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
    overflow:hidden;transition:box-shadow .2s;}
  .card.expanded{box-shadow:0 10px 36px rgba(16,19,46,.28);}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px;cursor:pointer;transition:background .15s;}
  .card-head:active{background:rgba(255,255,255,.25);}
  .card-summary{font-size:12px;color:var(--ink);margin-top:4px;font-weight:600;}
  .chevron{font-size:12px;color:var(--muted);transition:transform .2s;}
  .card.expanded .chevron{transform:rotate(180deg);}
  .card-body{max-height:0;opacity:0;overflow:hidden;padding:0 18px;
    transition:max-height .32s cubic-bezier(.4,0,.2,1),opacity .24s ease,padding .32s ease;}
  .card.expanded .card-body{max-height:1400px;opacity:1;padding:0 18px 18px;}
  .req-id{font-weight:800;font-size:15px;letter-spacing:.3px;color:var(--navy);}
  .status-chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;}
  .status-Pending{background:#fef3c7;color:var(--amber);}
  .status-Approved{background:#dcfce7;color:var(--green);}
  .status-Rejected{background:#fee2e2;color:var(--red);}
  .status-Dispensed{background:#dbeafe;color:var(--blue);}
  .meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;}
  input,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:16px;font-family:inherit;background:#fff;}
  input:focus,textarea:focus{outline:none;border-color:var(--orange);}
  .full{grid-column:1/-1;}
  .actions{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;padding:11px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-approve{background:var(--green);color:#fff;}
  .btn-reject{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .otp-box{margin-top:12px;background:rgba(240,253,244,.8);border:1px solid #bbf7d0;border-radius:9px;padding:14px;text-align:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .otp-box .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .err{margin-top:10px;background:rgba(254,242,242,.85);color:var(--red);border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

  .vo-panel{max-width:640px;margin:20px auto 0;}
  .vo-toggle{width:100%;text-align:left;padding:14px 18px;border-radius:16px;border:1px solid var(--glass-border);
    background:var(--glass-bg);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 32px rgba(16,19,46,.2);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
    display:flex;justify-content:space-between;align-items:center;}
  .vo-body{display:none;margin-top:10px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:16px;padding:14px;
    box-shadow:0 8px 32px rgba(16,19,46,.2);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  .vo-body.show{display:block;}
  .vo-table-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.5);}
  .vo-table-wrap table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  .vo-table-wrap th{text-align:left;padding:9px 10px;background:rgba(248,249,251,.6);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .vo-table-wrap td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .vo-table-wrap tr:last-child td{border-bottom:none;}
  .vo-row{cursor:pointer;}
  .vo-row:active{background:rgba(242,137,26,.12);}
  .vo-row .vo-chevron{font-size:10px;color:var(--muted);margin-left:6px;display:inline-block;transition:transform .15s;}
  .vo-row.open .vo-chevron{transform:rotate(180deg);}
  .vo-detail-row td{padding:0;background:rgba(27,31,79,.04);}
  .vo-history-wrap{overflow-x:auto;padding:8px;}
  .vo-history-table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px;}
  .vo-history-table th{text-align:left;padding:7px 9px;background:rgba(27,31,79,.06);color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .vo-history-table td{padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .vo-history-table tr:last-child td{border-bottom:none;}

  /* ---------- Login gate ---------- */
  #loginOverlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;
    background:
      radial-gradient(circle at 12% 8%, rgba(242,137,26,.35), transparent 42%),
      radial-gradient(circle at 88% 14%, rgba(224,169,76,.3), transparent 40%),
      radial-gradient(circle at 22% 92%, rgba(29,78,216,.22), transparent 45%),
      linear-gradient(135deg,#0d1030 0%,#1b1f4f 45%,#241a4d 100%);}
  #loginOverlay.hide{display:none;}
  .login-card{width:100%;max-width:360px;background:var(--glass-bg);border:1px solid var(--glass-border);
    border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 8px 32px rgba(16,19,46,.35);
    backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);}
  .login-card img{height:64px;width:auto;display:block;margin:0 auto 14px;border-radius:12px;}
  .login-card h2{margin:0 0 4px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:var(--navy);}
  .login-card .lsub{margin:0 0 18px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .login-card input{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--border);border-radius:9px;
    font-size:16px;font-family:inherit;background:#fff;}
  .login-card input:focus{outline:none;border-color:var(--orange);}
  .login-card button{width:100%;margin-top:6px;padding:12px;background:var(--orange);color:#fff;border:none;border-radius:9px;
    font-size:15px;font-weight:700;cursor:pointer;}
  .login-err{margin-top:10px;font-size:13px;color:var(--red);font-weight:600;min-height:18px;}
  .shake{animation:shake .4s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-9px);}
    40%,80%{transform:translateX(9px);}
  }
</style>
</head>
<body>
  <div id="loginOverlay">
    <div class="login-card" id="loginCard">
      <img src="logo.png" alt="Logo">
      <h2>🧾 Diesel Approval</h2>
      <p class="lsub">Stage 2 — Manager Login</p>
      <form id="loginForm">
        <input type="text" id="loginUser" placeholder="User ID" autocomplete="username" autocapitalize="off">
        <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
        <button type="submit">Login</button>
      </form>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <div class="topbar">
    <div class="topbar-inner">
      <img src="logo.png" alt="Logo" class="logo">
      <div class="title-divider"></div>
      <div class="topbar-text">
        <h1>🧾 Diesel Approval</h1>
        <p>Stage 2 — Manager Review</p>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="top-controls">
      <label style="margin-bottom:2px;">Manager Name</label>
      <input type="text" id="managerName" placeholder="Your name (saved when you approve/reject)">

      <div class="toolbar">
        <button class="filter-btn active" data-status="Pending">Pending</button>
        <button class="filter-btn" data-status="Approved">Approved</button>
        <button class="filter-btn" data-status="">All</button>
        <button class="refresh" id="refreshBtn">↻ Refresh</button>
      </div>
    </div>

    <div id="list"></div>

    <div class="vo-panel">
      <button class="vo-toggle" id="voToggle">
        <span>🚚 Vehicle-wise Overview — OTP count, last diesel dispensed</span>
        <span class="chevron" id="voChevron">▾</span>
      </button>
      <div class="vo-body" id="voBody">
        <input type="text" id="voSearch" placeholder="Search by vehicle number...">
        <div class="vo-table-wrap">
          <table>
            <thead>
              <tr><th>Vehicle</th><th>Total Req.</th><th>OTP Count</th><th>Last Liters</th><th>Last Date</th><th>Last By</th></tr>
            </thead>
            <tbody id="voTableBody"><tr><td colspan="6" style="padding:14px;color:var(--muted);">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
  /* ---------- Login gate ---------- */
  (function(){
    var USER = 'Manager2', PASS = 'Manager@11', KEY = 'dieselAuthManager';
    var overlay = document.getElementById('loginOverlay');
    var card = document.getElementById('loginCard');
    var errEl = document.getElementById('loginErr');

    if (sessionStorage.getItem(KEY) === '1') overlay.classList.add('hide');

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('loginUser').value.trim();
      var p = document.getElementById('loginPass').value;
      if (u === USER && p === PASS) {
        sessionStorage.setItem(KEY, '1');
        overlay.classList.add('hide');
        errEl.textContent = '';
      } else {
        errEl.textContent = 'Invalid User ID or Password';
        card.classList.remove('shake');
        void card.offsetWidth; // reflow so the shake animation can replay
        card.classList.add('shake');
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
        document.getElementById('loginPass').value = '';
      }
    });
  })();

  // Paste the /exec URL here after deploying the Google Apps Script "Web App"
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybGePj0rLOxG_xdK-XjXtipxm_izdiozm9rgWbKTsY7L7XbFhSrzgs86JNCWvxO-0ipw/exec";

  var listEl = document.getElementById('list');
  var currentStatus = 'Pending';

  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentStatus = btn.getAttribute('data-status');
      loadList();
    });
  });
  document.getElementById('refreshBtn').addEventListener('click', loadList);

  function loadList(){
    if (!APPS_SCRIPT_URL) {
      listEl.innerHTML = '<div class="empty">⚠️ Setup pending: deploy Code.gs and paste the APPS_SCRIPT_URL here in the HTML.</div>';
      return;
    }
    listEl.innerHTML = '<div class="empty">Loading...</div>';
    var url = APPS_SCRIPT_URL + '?action=list&status=' + encodeURIComponent(currentStatus);
    fetch(url).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) { listEl.innerHTML = '<div class="empty">Error: ' + res.error + '</div>'; return; }
      renderList(res.rows);
    }).catch(function(err){
      listEl.innerHTML = '<div class="empty">Network error: ' + err.message + '</div>';
    });
  }

  function renderList(rows){
    if (!rows.length) { listEl.innerHTML = '<div class="empty">No requests found.</div>'; return; }
    listEl.innerHTML = '';
    rows.forEach(function(row){ listEl.appendChild(renderCard(row)); });
  }

  function renderCard(row){
    var card = document.createElement('div');
    card.className = 'card';
    var editable = row.status === 'Pending';

    var metaParts = [fmtDate(row.createdAt), 'Requested by ' + esc(row.requestedBy)];
    if (row.managerName) metaParts.push((row.status === 'Rejected' ? 'Rejected by ' : 'Approved by ') + esc(row.managerName));
    if (row.dispensedBy) metaParts.push('Dispensed by ' + esc(row.dispensedBy));

    var header = document.createElement('div');
    header.className = 'card-head';
    header.innerHTML =
      '<div>' +
        '<div class="req-id">' + esc(row.id) + '</div>' +
        '<div class="card-summary">' + esc(row.vehicleNo || '-') + ' • ' + esc(row.driverName || '-') + ' • ' + esc(row.requestedLiters) + ' L</div>' +
        '<div class="meta">' + metaParts.join(' • ') + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">' +
        '<span class="status-chip status-' + row.status + '">' + row.status + '</span>' +
        '<span class="chevron">▾</span>' +
      '</div>';
    header.addEventListener('click', function(){
      var wasOpen = card.classList.contains('expanded');
      listEl.querySelectorAll('.card.expanded').forEach(function(el){ el.classList.remove('expanded'); });
      if (!wasOpen) card.classList.add('expanded');
    });
    card.appendChild(header);

    var body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<div class="grid">' +
        field('Vehicle No', 'vehicleNo', row.vehicleNo, editable) +
        field('Driver ID', 'driverId', row.driverId, editable) +
        field('Driver Name', 'driverName', row.driverName, editable) +
        field('Route / Trip', 'routeTrip', row.routeTrip, editable) +
        field('Current Location', 'currentLocation', row.currentLocation, false) +
        field('Pump / Location', 'pumpLocation', row.pumpLocation, editable) +
        field('Odometer (KM)', 'odometerKm', row.odometerKm, false) +
        field('Requested Liters', 'requestedLiters', row.requestedLiters, false) +
        field('Approved Liters', 'approvedLiters', row.approvedLiters || row.requestedLiters, editable, 'number') +
        '<div class="full">' + fieldTextarea('Manager Remarks', 'managerRemarks', row.managerRemarks) + '</div>' +
      '</div>';
    card.appendChild(body);

    if (row.status === 'Pending') {
      var actions = document.createElement('div');
      actions.className = 'actions';
      actions.innerHTML =
        '<button class="btn btn-approve">✔ Approve</button>' +
        '<button class="btn btn-reject">✕ Reject</button>';
      body.appendChild(actions);

      actions.querySelector('.btn-approve').addEventListener('click', function(){ doApprove(row.id, card, body, actions); });
      actions.querySelector('.btn-reject').addEventListener('click', function(){ doReject(row.id, card, body, actions); });
    }

    if (row.status === 'Approved') {
      var note = document.createElement('div');
      note.className = 'meta';
      note.style.marginTop = '10px';
      note.textContent = 'This request now shows directly in the Diesel Team\'s "Approved Requests" list.';
      body.appendChild(note);
    }

    return card;
  }

  function field(label, id, value, editable, type){
    var val = value === undefined || value === null ? '' : value;
    if (!editable) {
      return '<div><label>' + label + '</label><input value="' + esc(val) + '" data-field="' + id + '" disabled></div>';
    }
    return '<div><label>' + label + '</label><input type="' + (type||'text') + '" value="' + esc(val) + '" data-field="' + id + '"></div>';
  }
  function fieldTextarea(label, id, value){
    return '<label>' + label + '</label><textarea data-field="' + id + '" rows="2" placeholder="Optional remarks">' + esc(value||'') + '</textarea>';
  }

  function readFields(card){
    var out = {};
    card.querySelectorAll('[data-field]').forEach(function(el){
      out[el.getAttribute('data-field')] = el.value;
    });
    return out;
  }

  function doApprove(id, card, body, actions){
    var fields = readFields(card);
    var managerName = document.getElementById('managerName').value.trim();
    if (!managerName) { alert('Please fill in Manager Name first (above).'); return; }

    setActionsLoading(actions, true);
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'approve', id: id, managerName: managerName,
        vehicleNo: fields.vehicleNo, driverId: fields.driverId, driverName: fields.driverName,
        routeTrip: fields.routeTrip, pumpLocation: fields.pumpLocation,
        approvedLiters: fields.approvedLiters, managerRemarks: fields.managerRemarks
      })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) { showCardError(body, res.error); setActionsLoading(actions, false); return; }
      actions.remove();
      var box = document.createElement('div');
      box.className = 'otp-box';
      box.innerHTML = '<div style="color:var(--green);font-weight:700;">✔ Approved</div><div class="hint">Will show instantly in the Diesel Team\'s "Approved Requests" list — Request ID: ' + res.requestId + '</div>';
      body.appendChild(box);
    }).catch(function(err){ showCardError(body, err.message); setActionsLoading(actions, false); });
  }

  function doReject(id, card, body, actions){
    var fields = readFields(card);
    var managerName = document.getElementById('managerName').value.trim();
    if (!managerName) { alert('Please fill in Manager Name first (above).'); return; }
    if (!confirm('Reject this request?')) return;

    setActionsLoading(actions, true);
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'reject', id: id, managerName: managerName, managerRemarks: fields.managerRemarks })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) { showCardError(body, res.error); setActionsLoading(actions, false); return; }
      loadList();
    }).catch(function(err){ showCardError(body, err.message); setActionsLoading(actions, false); });
  }

  function setActionsLoading(actions, loading){
    actions.querySelectorAll('button').forEach(function(b){ b.disabled = loading; });
  }
  function showCardError(container, msg){
    var e = document.createElement('div');
    e.className = 'err';
    e.textContent = msg;
    container.appendChild(e);
  }
  function fmtDate(d){
    if (!d) return '';
    try { return new Date(d).toLocaleString('en-IN'); } catch(e){ return d; }
  }
  function esc(s){
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  loadList();

  /* ---------- Vehicle-wise Overview (OTP count / last dispensed) ---------- */
  var voToggle = document.getElementById('voToggle');
  var voChevron = document.getElementById('voChevron');
  var voBody = document.getElementById('voBody');
  var voTableBody = document.getElementById('voTableBody');
  var voSearch = document.getElementById('voSearch');
  var vehicleStats = null;
  var vehicleStatsLoaded = false;

  voToggle.addEventListener('click', function(){
    var open = voBody.classList.toggle('show');
    voChevron.textContent = open ? '▴' : '▾';
    if (open && !vehicleStatsLoaded) loadVehicleOverview();
  });
  voSearch.addEventListener('input', function(){ renderVehicleOverview(); });

  function loadVehicleOverview(){
    if (!APPS_SCRIPT_URL) {
      voTableBody.innerHTML = '<tr><td colspan="6" style="padding:14px;color:var(--muted);">Setup pending.</td></tr>';
      return;
    }
    voTableBody.innerHTML = '<tr><td colspan="6" style="padding:14px;color:var(--muted);">Loading...</td></tr>';
    fetch(APPS_SCRIPT_URL + '?action=list')
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) { voTableBody.innerHTML = '<tr><td colspan="6" style="padding:14px;color:var(--red);">Error: ' + esc(res.error) + '</td></tr>'; return; }
        vehicleStats = aggregateVehicles(res.rows);
        vehicleStatsLoaded = true;
        renderVehicleOverview();
      })
      .catch(function(err){
        voTableBody.innerHTML = '<tr><td colspan="6" style="padding:14px;color:var(--red);">Network error: ' + esc(err.message) + '</td></tr>';
      });
  }

  function aggregateVehicles(rows){
    var map = {};
    rows.forEach(function(r){
      var v = r.vehicleNo || '(unknown)';
      if (!map[v]) map[v] = { vehicle: v, total: 0, otpCount: 0, lastLiters: null, lastDate: null, lastDateObj: null, lastBy: null, records: [] };
      map[v].total++;
      map[v].records.push(r);
      if (r.status === 'Approved' || r.status === 'Dispensed') map[v].otpCount++;
      if (r.status === 'Dispensed' && r.dispensedAt) {
        var d = new Date(r.dispensedAt);
        if (!map[v].lastDateObj || d > map[v].lastDateObj) {
          map[v].lastDateObj = d;
          map[v].lastDate = fmtDate(r.dispensedAt);
          map[v].lastLiters = r.actualLiters;
          map[v].lastBy = r.dispensedBy;
        }
      }
    });
    var list = [];
    for (var k in map) {
      map[k].records.sort(function(a, b){ return new Date(b.createdAt) - new Date(a.createdAt); });
      list.push(map[k]);
    }
    list.sort(function(a, b){
      var at = a.lastDateObj ? a.lastDateObj.getTime() : 0;
      var bt = b.lastDateObj ? b.lastDateObj.getTime() : 0;
      return bt - at;
    });
    return list;
  }

  var voVisibleRows = [];

  function renderVehicleOverview(){
    if (!vehicleStats) return;
    var q = voSearch.value.trim().toUpperCase();
    var rows = q ? vehicleStats.filter(function(v){ return v.vehicle.toUpperCase().indexOf(q) !== -1; }) : vehicleStats;
    voVisibleRows = rows;
    if (!rows.length) { voTableBody.innerHTML = '<tr><td colspan="6" style="padding:14px;color:var(--muted);">No vehicles found.</td></tr>'; return; }
    voTableBody.innerHTML = rows.map(function(v, i){
      return '<tr class="vo-row" data-idx="' + i + '">' +
        '<td><b>' + esc(v.vehicle) + '</b><span class="vo-chevron">▾</span></td>' +
        '<td>' + v.total + '</td>' +
        '<td>' + v.otpCount + '</td>' +
        '<td>' + esc(v.lastLiters || '-') + '</td>' +
        '<td>' + esc(v.lastDate || '-') + '</td>' +
        '<td>' + esc(v.lastBy || '-') + '</td>' +
      '</tr>';
    }).join('');
  }

  voTableBody.addEventListener('click', function(e){
    var tr = e.target.closest('tr.vo-row');
    if (!tr) return;
    var next = tr.nextElementSibling;
    if (next && next.classList.contains('vo-detail-row')) {
      next.remove();
      tr.classList.remove('open');
      return;
    }
    document.querySelectorAll('.vo-detail-row').forEach(function(d){ d.remove(); });
    document.querySelectorAll('.vo-row.open').forEach(function(r){ r.classList.remove('open'); });

    var idx = Number(tr.getAttribute('data-idx'));
    var vehicle = voVisibleRows[idx];
    tr.classList.add('open');
    var detailTr = document.createElement('tr');
    detailTr.className = 'vo-detail-row';
    var td = document.createElement('td');
    td.colSpan = 6;
    td.innerHTML = buildVehicleHistoryHTML(vehicle);
    detailTr.appendChild(td);
    tr.parentNode.insertBefore(detailTr, tr.nextSibling);
  });

  function buildVehicleHistoryHTML(v){
    if (!v.records.length) return '<div style="padding:10px;color:var(--muted);">No records found.</div>';
    var rowsHtml = v.records.map(function(r){
      return '<tr>' +
        '<td>' + esc(r.id) + '</td>' +
        '<td>' + fmtDate(r.createdAt) + '</td>' +
        '<td><span class="status-chip status-' + r.status + '">' + esc(r.status) + '</span></td>' +
        '<td>' + esc(r.requestedLiters) + '</td>' +
        '<td>' + esc(r.approvedLiters || '-') + '</td>' +
        '<td>' + esc(r.actualLiters || '-') + '</td>' +
        '<td>' + esc(r.driverName || '-') + '</td>' +
        '<td>' + esc(r.requestedBy || '-') + '</td>' +
        '<td>' + esc(r.managerName || '-') + '</td>' +
        '<td>' + esc(r.dispensedBy || '-') + '</td>' +
      '</tr>';
    }).join('');
    return '<div class="vo-history-wrap"><table class="vo-history-table">' +
      '<thead><tr><th>Req ID</th><th>Date</th><th>Status</th><th>Req.L</th><th>Appr.L</th><th>Actual L</th><th>Driver</th><th>Requested By</th><th>Manager</th><th>Dispensed By</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>';
  }
</script>
</body>
</html>
